name: Bug report
description: Report only bugs here!
body:
  - type: markdown
    attributes:
      value: |
        * Before reporting a new bug please check and search the [list of existing issues](https://github.com/pschatzmann/TinyFonts/issues?q=)
        * Please check [the Readme](https://github.com/pschatzmann/TinyFonts) and the [documentation in docs/](https://github.com/pschatzmann/TinyFonts/tree/main/docs)
        * Don't forget to check [the discussions](https://github.com/pschatzmann/TinyFonts/discussions)
        * If still experiencing the issue, please provide as many details as possible below about your hardware, computer setup and code.
  - type: textarea
    id: Description
    attributes:
      label: Problem Description
      description: Please describe your problem here and the expected behaviour
      placeholder: e.g. text is clipped at the right edge / wrong glyph is drawn / converter fails / missing parameter..
    validations:
      required: true
  - type: textarea
    id: Board
    attributes:
      label: Device Description
      description: What board and display are you using
      placeholder: e.g. Arduino Uno, ESP32-S3, RP2040, Desktop build (SDL2)
    validations:
      required: true
  - type: textarea
    id: font
    attributes:
      label: Font
      description: Which font header are you using, and how was it generated? Please paste the tools/tinyfonts_convert.py command if you generated it yourself, or name the bundled font (e.g. Lato16).
      placeholder: e.g. python3 tools/tinyfonts_convert.py --font Lato-Regular.ttf --size 16 --bpp 2 --chars ascii,latin1,euro --name Lato16 --out Lato16.h
    validations:
      required: false
  - type: textarea
    id: sketch
    attributes:
      label: Sketch
      description: Please provide the full minimal sketch or code which can be run to reproduce your issue
      placeholder: e.g. the related part of the code to replicate the issue
      render: cpp
    validations:
      required: true
  - type: textarea
    id: other-remarks
    attributes:
      label: Other Steps to Reproduce
      description: Is there any other information which will help us reproduce this problem? Any additional info can be added as well.
      placeholder: e.g. I also tried on another board or OS, and it works correctly there.
  - type: textarea
    id: sceanario
    attributes:
      label: What is your development environment (incl. core version info)
      description: Please provide information about your development and runtime environment
      placeholder: Arduino AVR 1.8.8, ESP32 core 3.x, PlatformIO, TinyGPU 0.4.0, CMake 3.28, Python 3.12 with Pillow and fontTools, Desktop build
  - type: checkboxes
    id: confirmation
    attributes:
      label: I have checked existing issues, discussions and online documentation
      description: You agree to check all the resources above before opening a new issue.
      options:
        - label: I confirm I have checked existing issues, discussions and online documentation
          required: true
