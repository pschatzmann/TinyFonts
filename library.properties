name=TinyFonts
version=0.1.0
author=Phil Schatzmann
maintainer=Phil Schatzmann
sentence=Header-only font rendering for Arduino with compact embedded fonts.
paragraph=Converts TrueType/OpenType fonts on the development machine into compact byte arrays with metrics, kerning and anti-aliasing. The device-side renderer is header-only and draws through a FontDisplay interface, so it works with any display driver or graphics library.
category=Display
architectures=*
